name: tests
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
jobs:
  bun-test:
    runs-on: macos-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install
      - run: bun test
